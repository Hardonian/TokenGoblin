name: Deploy Cloudflare Worker + Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  id-token: write

env:
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.105.0'

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy Worker
        # Failures must surface: a broken CF_API_TOKEN used to be masked by
        # continue-on-error, so every run "succeeded" while deploying nothing.
        working-directory: deploy/workers
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured, skipping worker deployment."
            exit 0
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --minify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy Frontend
        # Failures must surface: a broken CF_API_TOKEN used to be masked by
        # continue-on-error, so every run "succeeded" while deploying nothing.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured, skipping frontend deployment."
            exit 0
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy deploy/frontend --project-name tokengoblin-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy Landing
        # Failures must surface: a broken CF_API_TOKEN used to be masked by
        # continue-on-error, so every run "succeeded" while deploying nothing.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured, skipping landing deployment."
            exit 0
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy deploy/landing --project-name tokengoblin-landing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
