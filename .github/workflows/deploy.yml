name: Deploy Cloudflare Worker + Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys: rapid pushes used to fire 3 parallel wrangler jobs each and
# trip Cloudflare's API rate limit (code 10429), leaving the CD red.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  id-token: write

env:
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.105.0'

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy Worker
        # Failures must surface: a broken CF_API_TOKEN used to be masked by
        # continue-on-error, so every run "succeeded" while deploying nothing.
        working-directory: deploy/workers
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured, skipping worker deployment."
            exit 0
          fi
          # Bounded retry for Cloudflare API rate limiting ONLY (code 10429).
          # Any other failure surfaces immediately — failures must never be masked.
          attempt=1
          while true; do
            if output=$(npx --yes "wrangler@${WRANGLER_VERSION}" deploy --minify 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if [ "$attempt" -ge 3 ] || ! grep -q '10429' <<<"$output"; then
              exit 1
            fi
            echo "Rate limited by Cloudflare API (10429); retry ${attempt}/3 in $((20 * attempt))s"
            sleep $((20 * attempt))
            attempt=$((attempt + 1))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy Frontend
        # Failures must surface: a broken CF_API_TOKEN used to be masked by
        # continue-on-error, so every run "succeeded" while deploying nothing.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured, skipping frontend deployment."
            exit 0
          fi
          attempt=1
          while true; do
            if output=$(npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy deploy/frontend --project-name tokengoblin-frontend 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if [ "$attempt" -ge 3 ] || ! grep -q '10429' <<<"$output"; then
              exit 1
            fi
            echo "Rate limited by Cloudflare API (10429); retry ${attempt}/3 in $((20 * attempt))s"
            sleep $((20 * attempt))
            attempt=$((attempt + 1))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  deploy-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Deploy Landing
        # Failures must surface: a broken CF_API_TOKEN used to be masked by
        # continue-on-error, so every run "succeeded" while deploying nothing.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not configured, skipping landing deployment."
            exit 0
          fi
          attempt=1
          while true; do
            if output=$(npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy deploy/landing --project-name tokengoblin-landing 2>&1); then
              echo "$output"
              exit 0
            fi
            echo "$output"
            if [ "$attempt" -ge 3 ] || ! grep -q '10429' <<<"$output"; then
              exit 1
            fi
            echo "Rate limited by Cloudflare API (10429); retry ${attempt}/3 in $((20 * attempt))s"
            sleep $((20 * attempt))
            attempt=$((attempt + 1))
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
